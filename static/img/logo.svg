<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Fondo redondeado -->
  <rect x="0" y="5" width="400" height="110" rx="14" ry="14" fill="url(#bgGrad)" />

  <!-- Diente estilizado -->
  <g transform="translate(52, 22)" fill="white">
    <!-- Corona del diente (ancha arriba, se estrecha abajo) -->
    <path d="M0,0 
             C0,0 8,-12 18,-12 
             C28,-12 36,0 36,0
             C36,12 28,24 22,48
             C20,56 18,60 18,60
             C18,60 16,56 14,48
             C8,24 0,12 0,0Z" />
    <!-- Raíz -->
    <path d="M14,48 C12,56 10,64 10,70 C10,74 14,74 18,74 C22,74 26,74 26,70 C26,64 24,56 22,48" />
    <!-- Reflejo de luz en la corona -->
    <path d="M8,0 C10,-6 16,-8 20,-6 C16,-4 12,0 10,6 C8,4 8,2 8,0Z" fill="rgba(255,255,255,0.3)" />
  </g>

  <!-- Línea vertical separadora -->
  <line x1="105" y1="24" x2="105" y2="96" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Texto TEODORO DOMÍNGUEZ -->
  <text x="116" y="58" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="white" letter-spacing="1">TEODORO DOMÍNGUEZ</text>

  <!-- Texto ODONTÓLOGO -->
  <text x="116" y="86" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.85)" letter-spacing="4">ODONTÓLOGO</text>

  <!-- Línea decorativa bajo ODONTÓLOGO -->
  <line x1="116" y1="94" x2="310" y2="94" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
</svg>
