{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="dashboard">
    {% include 'componentes/sidebar.html' with active='sri_log' %}
    <main class="main-content">
        {% include 'componentes/topbar.html' %}
        <div class="dashboard-content p-6 lg:p-8">
            <!-- Encabezado -->
            <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">Log SRI</h1>
                    <p class="mt-1 text-sm text-slate-500">Registro de eventos del SRI (media/sri/sri.log)</p>
                </div>
                <a href="{% url 'sri_documentos' %}"
                   class="inline-flex items-center justify-center gap-2 self-start rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-600 transition hover:border-slate-400 hover:bg-slate-50 sm:self-auto">
                    <i class="fas fa-arrow-left"></i> Volver
                </a>
            </div>

            <!-- Visor del log -->
            <div class="overflow-hidden rounded-2xl border border-slate-800 bg-slate-900 shadow-lg shadow-slate-900/10">
                <div class="flex items-center justify-between border-b border-slate-800 px-5 py-3">
                    <div class="flex items-center gap-3">
                        <span class="flex gap-1.5">
                            <span class="h-3 w-3 rounded-full bg-red-500/80"></span>
                            <span class="h-3 w-3 rounded-full bg-amber-400/80"></span>
                            <span class="h-3 w-3 rounded-full bg-emerald-500/80"></span>
                        </span>
                        <span class="font-mono text-xs font-semibold text-slate-300">sri.log</span>
                    </div>
                    <button onclick="window.location.reload()"
                            class="inline-flex items-center gap-2 rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs font-semibold text-slate-200 transition hover:border-slate-500 hover:bg-slate-700">
                        <i class="fas fa-sync"></i> Refrescar
                    </button>
                </div>
                <pre class="max-h-[600px] overflow-y-auto whitespace-pre-wrap break-all px-5 py-4 font-mono text-xs leading-relaxed text-slate-200">{{ contenido }}</pre>
            </div>
        </div>
    </main>
</div>
{% endblock %}
