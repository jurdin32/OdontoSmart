{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="auth-container">
    <div class="auth-left">
        <div class="auth-brand">
            <img src="{% static 'img/LOGO.png' %}" alt="Teodoro Domínguez Odontólogo" class="auth-logo">
            <p class="brand-subtitle" style="margin-top:10px;">Sistema de Gestión Odontológica</p>
        </div>
        
        <div class="auth-illustration">
            <div class="floating-shape shape-1"></div>
            <div class="floating-shape shape-2"></div>
            <div class="floating-shape shape-3"></div>
            <div class="illustration-content">
                <p class="illustration-text">Recupera tu acceso</p>
            </div>
        </div>
    </div>

    <div class="auth-right">
        <div class="auth-form-wrapper">
            <div class="auth-header">
                <h2 class="auth-title">Restablecer Contraseña</h2>
                <p class="auth-description">Ingresa tu usuario y tu nueva contraseña</p>
            </div>

            <form method="POST" class="auth-form" novalidate>
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="id_username" class="form-label">
                        <i class="fas fa-user"></i>
                        Nombre de usuario
                    </label>
                    <input type="text" name="username" id="id_username" class="form-input" placeholder="Tu nombre de usuario" required autofocus>
                </div>

                <div class="form-group">
                    <label for="id_password1" class="form-label">
                        <i class="fas fa-lock"></i>
                        Nueva contraseña
                    </label>
                    <input type="password" name="password1" id="id_password1" class="form-input" placeholder="Mínimo 8 caracteres" required>
                </div>

                <div class="form-group">
                    <label for="id_password2" class="form-label">
                        <i class="fas fa-lock"></i>
                        Confirmar contraseña
                    </label>
                    <input type="password" name="password2" id="id_password2" class="form-input" placeholder="Repite la contraseña" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    <span>Restablecer</span>
                    <i class="fas fa-check"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p><a href="{% url 'login' %}" class="auth-link"><i class="fas fa-arrow-left"></i> Volver al inicio de sesión</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
